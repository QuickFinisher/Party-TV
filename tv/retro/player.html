<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Party TV Retro Player</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #game { width: 100%; height: 100%; }
    /* hide EmulatorJS's own menus — the phones and the TV overlay drive everything */
    .ejs_menu_bar, .ejs_virtualGamepad_parent, .ejs_context_menu, .ejs_settings_parent,
    .ejs_popup_container, .ejs_start_button, .ejs_netplay_header { display: none !important; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="player.js"></script>
</body>
</html>
